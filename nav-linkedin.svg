<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 150 140" width="150" height="140" role="img" aria-label="LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd3a5"/>
      <stop offset="1" stop-color="#2b9fc9"/>
    </linearGradient>
    <path id="petal" d="M0 0 C5 -6 12 -3 10 3 C8 9 2 10 0 5 C-2 2 -2 -1 0 0 Z"/>
  </defs>
  <style>
    .kanji { font: 700 44px 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'MS Mincho', serif; fill: url(#g); }
    .lab   { font: 700 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8a8a99; letter-spacing: .5px; }
    .ro    { font: italic 400 11px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #2b9fc9; letter-spacing: 1px; }
    .card  { animation: bob 4s ease-in-out infinite; animation-delay: 1.4s; }
    .p     { fill: #f6b6cb; opacity: 0; transform-box: fill-box; transform-origin: center; animation: fall 6s linear infinite; animation-delay: 1.4s; }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes fall {
      0%   { transform: translate(0,-6px) rotate(0deg); opacity: 0; }
      15%  { opacity: .9; }
      85%  { opacity: .7; }
      100% { transform: translate(16px,128px) rotate(300deg); opacity: 0; }
    }
  </style>
  <g class="card">
    <!-- torii-style top beam -->
    <path d="M4 20 Q75 6 146 20 L142 29 Q75 17 8 29 Z" fill="#2b7a9b"/>
    <rect x="22" y="29" width="5" height="12" fill="#2b7a9b"/>
    <rect x="123" y="29" width="5" height="12" fill="#2b7a9b"/>
    <!-- plaque -->
    <rect x="12" y="40" width="126" height="92" rx="8" fill="#3fb98a" fill-opacity=".08" stroke="#3f8f6e" stroke-width="1.5"/>
    <rect x="18" y="46" width="114" height="80" rx="5" fill="none" stroke="#3f8f6e" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="3 3"/>
    <text x="75" y="92" text-anchor="middle" class="kanji">縁</text>
    <text x="75" y="111" text-anchor="middle" class="lab">LinkedIn</text>
    <text x="75" y="123" text-anchor="middle" class="ro">En</text>
  </g>
  <use xlink:href="#petal" x="64" y="30" class="p"/>
</svg>
