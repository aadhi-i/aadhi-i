<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 320" width="100%" height="320" role="img" aria-label="Adithya S Nair, Associate Developer at EY, with a Japanese castle and sakura petals" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="petal" d="M0 0 C6 -7 15 -4 13 4 C11 12 3 13 0 7 C-3 3 -3 -2 0 0 Z"/>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd3a5"/>
      <stop offset="1" stop-color="#2b9fc9"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 40px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#title); letter-spacing: 1px; }
    .role { font: 400 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8a8a99; letter-spacing: 0.5px; }
    .jp   { font: 400 14px 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #2b9fc9; opacity: .9; letter-spacing: 8px; }
    .moon { animation: glow 6s ease-in-out infinite; }
    .cloud { fill: #3f8f6e; opacity: .14; animation: cloud 40s linear infinite; }
    .cloud2 { animation-duration: 55s; animation-delay: -20s; }
    .lan { animation: sway 5s ease-in-out infinite; }
    .lan2 { animation-delay: -2.5s; }
    .flame { animation: flicker 2.2s ease-in-out infinite; }
    .p { fill: #f6b6cb; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .a { animation: fallA 10s linear infinite; }
    .b { animation: fallB 12s linear infinite; }
    .c { animation: fallC 14s linear infinite; }
    @keyframes glow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    @keyframes cloud { from { transform: translateX(-200px); } to { transform: translateX(1000px); } }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes flicker { 0%,100% { opacity: .55; } 40% { opacity: 1; } 70% { opacity: .7; } }
    @keyframes fallA {
      0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
      10%  { opacity: .9; }
      50%  { transform: translate(40px, 160px) rotate(180deg); }
      90%  { opacity: .8; }
      100% { transform: translate(-10px, 350px) rotate(360deg); opacity: 0; }
    }
    @keyframes fallB {
      0%   { transform: translate(0, -30px) rotate(40deg) scale(.8); opacity: 0; }
      10%  { opacity: .85; }
      50%  { transform: translate(-45px, 160px) rotate(220deg) scale(.8); }
      90%  { opacity: .75; }
      100% { transform: translate(20px, 350px) rotate(400deg) scale(.8); opacity: 0; }
    }
    @keyframes fallC {
      0%   { transform: translate(0, -30px) rotate(90deg) scale(1.2); opacity: 0; }
      10%  { opacity: .7; }
      50%  { transform: translate(30px, 160px) rotate(270deg) scale(1.2); }
      90%  { opacity: .6; }
      100% { transform: translate(-30px, 350px) rotate(450deg) scale(1.2); opacity: 0; }
    }
  </style>

  <!-- moon -->
  <g class="moon">
    <circle cx="660" cy="72" r="46" fill="#7cc9a5" opacity=".12"/>
    <circle cx="660" cy="72" r="32" fill="#e6f6ee" stroke="#7cc9a5" stroke-width="1.5"/>
    <circle cx="650" cy="64" r="5" fill="#bfe3d0"/>
    <circle cx="670" cy="82" r="7" fill="#bfe3d0"/>
  </g>

  <!-- drifting clouds -->
  <ellipse class="cloud" cx="0" cy="40" rx="90" ry="9"/>
  <ellipse class="cloud cloud2" cx="0" cy="190" rx="120" ry="11"/>

  <!-- mountains -->
  <path d="M0 320 L0 235 L110 160 L200 245 L300 190 L400 265 L500 185 L610 250 L700 165 L800 232 L800 320 Z" fill="#3f8f6e" opacity=".2"/>
  <path d="M0 320 L0 265 Q120 235 240 272 Q400 240 560 274 Q690 242 800 268 L800 320 Z" fill="#2f6f5a" opacity=".4"/>

  <!-- pines -->
  <g fill="#1f5a49" opacity=".85">
    <g transform="translate(250 300)"><path d="M0 -62 L16 -34 L8 -34 L22 -10 L-22 -10 L-8 -34 L-16 -34 Z"/><rect x="-3" y="-10" width="6" height="10"/></g>
    <g transform="translate(290 300) scale(.8)"><path d="M0 -62 L16 -34 L8 -34 L22 -10 L-22 -10 L-8 -34 L-16 -34 Z"/><rect x="-3" y="-10" width="6" height="10"/></g>
    <g transform="translate(540 300) scale(.9)"><path d="M0 -62 L16 -34 L8 -34 L22 -10 L-22 -10 L-8 -34 L-16 -34 Z"/><rect x="-3" y="-10" width="6" height="10"/></g>
    <g transform="translate(585 300) scale(.7)"><path d="M0 -62 L16 -34 L8 -34 L22 -10 L-22 -10 L-8 -34 L-16 -34 Z"/><rect x="-3" y="-10" width="6" height="10"/></g>
    <g transform="translate(700 300)"><path d="M0 -62 L16 -34 L8 -34 L22 -10 L-22 -10 L-8 -34 L-16 -34 Z"/><rect x="-3" y="-10" width="6" height="10"/></g>
  </g>

  <!-- torii gate -->
  <g fill="#2b7a9b">
    <rect x="124" y="238" width="9" height="62"/>
    <rect x="172" y="238" width="9" height="62"/>
    <rect x="116" y="254" width="73" height="6"/>
    <path d="M100 240 Q152.5 230 205 240 L201 248 Q152.5 240 109 248 Z"/>
  </g>

  <!-- castle -->
  <g>
    <!-- stone base -->
    <path d="M326 300 L344 262 L456 262 L474 300 Z" fill="#5b7f73"/>
    <path d="M338 285 H462 M344 273 H456" stroke="#486a5f" stroke-width="1.2"/>
    <!-- tier 1 -->
    <rect x="352" y="234" width="96" height="30" fill="#d3e7dc" stroke="#2f6f5a" stroke-width="1.2"/>
    <g fill="#2f6f5a"><rect x="366" y="244" width="8" height="10"/><rect x="396" y="244" width="8" height="10"/><rect x="426" y="244" width="8" height="10"/></g>
    <path d="M316 244 Q350 242 358 226 L442 226 Q450 242 484 244 Q400 254 316 244 Z" fill="#1f4d3f"/>
    <!-- tier 2 -->
    <rect x="364" y="200" width="72" height="28" fill="#d3e7dc" stroke="#2f6f5a" stroke-width="1.2"/>
    <g fill="#2f6f5a"><rect x="376" y="209" width="7" height="9"/><rect x="396.5" y="209" width="7" height="9"/><rect x="417" y="209" width="7" height="9"/></g>
    <path d="M334 208 Q366 206 372 190 L428 190 Q434 206 466 208 Q400 217 334 208 Z" fill="#1f4d3f"/>
    <!-- tier 3 -->
    <rect x="376" y="170" width="48" height="22" fill="#d3e7dc" stroke="#2f6f5a" stroke-width="1.2"/>
    <g fill="#2f6f5a"><rect x="386" y="177" width="6" height="8"/><rect x="408" y="177" width="6" height="8"/></g>
    <path d="M352 177 Q380 175 384 160 L416 160 Q420 175 448 177 Q400 185 352 177 Z" fill="#1f4d3f"/>
    <!-- top -->
    <rect x="386" y="140" width="28" height="22" fill="#d3e7dc" stroke="#2f6f5a" stroke-width="1.2"/>
    <rect x="395" y="147" width="10" height="10" fill="#2f6f5a"/>
    <path d="M364 148 Q392 146 394 130 L406 130 Q408 146 436 148 Q400 156 364 148 Z" fill="#1f4d3f"/>
    <!-- golden shachi ornaments -->
    <path d="M396 130 Q400 112 404 130 Z" fill="#d9b44a"/>
    <circle cx="372" cy="143" r="3" fill="#d9b44a"/>
    <circle cx="428" cy="143" r="3" fill="#d9b44a"/>
  </g>

  <!-- ground -->
  <rect x="0" y="298" width="800" height="22" fill="#2f6f5a" opacity=".55"/>

  <!-- hanging lanterns -->
  <g class="lan" style="transform-origin: 70px 0px">
    <line x1="70" y1="0" x2="70" y2="26" stroke="#2f6f5a" stroke-width="1.5"/>
    <rect x="62" y="26" width="16" height="4" fill="#2f6f5a"/>
    <ellipse cx="70" cy="46" rx="13" ry="16" fill="#b9f0cf" stroke="#2b9fc9" stroke-width="1.5"/>
    <ellipse class="flame" cx="70" cy="46" rx="6" ry="9" fill="#ffffff"/>
    <path d="M58 46 H82 M60 38 H80 M60 54 H80" stroke="#2b9fc9" stroke-width=".8" fill="none" opacity=".7"/>
    <rect x="62" y="62" width="16" height="4" fill="#2f6f5a"/>
    <line x1="70" y1="66" x2="70" y2="78" stroke="#2b9fc9" stroke-width="1.5"/>
  </g>
  <g class="lan lan2" style="transform-origin: 730px 0px">
    <line x1="730" y1="0" x2="730" y2="26" stroke="#2f6f5a" stroke-width="1.5"/>
    <rect x="722" y="26" width="16" height="4" fill="#2f6f5a"/>
    <ellipse cx="730" cy="46" rx="13" ry="16" fill="#b9f0cf" stroke="#2b9fc9" stroke-width="1.5"/>
    <ellipse class="flame" cx="730" cy="46" rx="6" ry="9" fill="#ffffff"/>
    <path d="M718 46 H742 M720 38 H740 M720 54 H740" stroke="#2b9fc9" stroke-width=".8" fill="none" opacity=".7"/>
    <rect x="722" y="62" width="16" height="4" fill="#2f6f5a"/>
    <line x1="730" y1="66" x2="730" y2="78" stroke="#2b9fc9" stroke-width="1.5"/>
  </g>

  <!-- title -->
  <text x="400" y="76" text-anchor="middle" class="name">Adithya S Nair</text>
  <text x="400" y="104" text-anchor="middle" class="role">Associate Developer @ EY</text>
  <text x="400" y="128" text-anchor="middle" class="jp">侍 · 城 · 桜</text>

  <!-- sakura petals (stay pink) -->
  <g>
    <use xlink:href="#petal" x="40"  y="0" class="p a" style="animation-delay:0s"/>
    <use xlink:href="#petal" x="110" y="0" class="p b" style="animation-delay:-3s"/>
    <use xlink:href="#petal" x="180" y="0" class="p c" style="animation-delay:-6s"/>
    <use xlink:href="#petal" x="250" y="0" class="p a" style="animation-delay:-2s"/>
    <use xlink:href="#petal" x="320" y="0" class="p b" style="animation-delay:-8s"/>
    <use xlink:href="#petal" x="390" y="0" class="p c" style="animation-delay:-4s"/>
    <use xlink:href="#petal" x="460" y="0" class="p a" style="animation-delay:-7s"/>
    <use xlink:href="#petal" x="530" y="0" class="p b" style="animation-delay:-1s"/>
    <use xlink:href="#petal" x="600" y="0" class="p c" style="animation-delay:-9s"/>
    <use xlink:href="#petal" x="670" y="0" class="p a" style="animation-delay:-5s"/>
    <use xlink:href="#petal" x="740" y="0" class="p b" style="animation-delay:-10s"/>
    <use xlink:href="#petal" x="75"  y="0" class="p c" style="animation-delay:-11s"/>
    <use xlink:href="#petal" x="285" y="0" class="p c" style="animation-delay:-12s"/>
    <use xlink:href="#petal" x="495" y="0" class="p a" style="animation-delay:-6.5s"/>
    <use xlink:href="#petal" x="705" y="0" class="p b" style="animation-delay:-4.5s"/>
    <use xlink:href="#petal" x="145" y="0" class="p a" style="animation-delay:-13s"/>
    <use xlink:href="#petal" x="355" y="0" class="p b" style="animation-delay:-9.5s"/>
    <use xlink:href="#petal" x="565" y="0" class="p c" style="animation-delay:-3.5s"/>
  </g>
</svg>
