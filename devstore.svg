<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 140" width="100%" height="140" role="img" aria-label="Dev Store - download useful apps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="petal" d="M0 0 C5 -6 12 -3 10 3 C8 9 2 10 0 5 C-2 2 -2 -1 0 0 Z"/>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd3a5"/>
      <stop offset="1" stop-color="#2b9fc9"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb98a"/>
      <stop offset="1" stop-color="#2b87b3"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#title); letter-spacing: 1px; }
    .sub   { font: 400 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8a8a99; }
    .jp    { font: 400 13px 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: #2b9fc9; opacity: .9; letter-spacing: 4px; }
    .cta   { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .border { fill: rgba(63,185,138,.07); stroke: #3f8f6e; stroke-width: 1.5; stroke-dasharray: 10 8; animation: march 1.6s linear infinite; }
    .btn { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .arrow { animation: nudge 1.2s ease-in-out infinite; }
    .p { fill: #f6b6cb; opacity: 0; transform-box: fill-box; transform-origin: center; animation: fall 8s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -36; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @keyframes fall {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      10%  { opacity: .9; }
      90%  { opacity: .7; }
      100% { transform: translate(24px, 160px) rotate(360deg); opacity: 0; }
    }
  </style>

  <rect x="8" y="8" width="784" height="124" rx="18" class="border"/>

  <!-- mini castle icon -->
  <g transform="translate(470 22) scale(.55)" opacity=".9">
    <path d="M0 80 L12 62 L88 62 L100 80 Z" fill="#5b7f73"/>
    <rect x="14" y="44" width="72" height="20" fill="#d3e7dc" stroke="#2f6f5a"/>
    <path d="M-6 50 Q20 48 26 36 L74 36 Q80 48 106 50 Q50 58 -6 50 Z" fill="#1f4d3f"/>
    <rect x="26" y="22" width="48" height="16" fill="#d3e7dc" stroke="#2f6f5a"/>
    <path d="M10 26 Q34 24 38 12 L62 12 Q66 24 90 26 Q50 33 10 26 Z" fill="#1f4d3f"/>
    <path d="M46 12 Q50 -2 54 12 Z" fill="#d9b44a"/>
  </g>

  <text x="44" y="56" class="title">Dev Store</text>
  <text x="44" y="82" class="sub">Handy apps and tools I built. Free to download.</text>
  <text x="44" y="108" class="jp">開発者ストア</text>

  <g class="btn">
    <rect x="590" y="47" width="170" height="46" rx="23" fill="url(#btn)"/>
    <text x="630" y="75" class="cta">Browse Apps</text>
    <g class="arrow">
      <path d="M722 70 H736 M731 64 L737 70 L731 76" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <use xlink:href="#petal" x="300" y="0" class="p" style="animation-delay:0s"/>
  <use xlink:href="#petal" x="420" y="0" class="p" style="animation-delay:-3s"/>
  <use xlink:href="#petal" x="540" y="0" class="p" style="animation-delay:-5s"/>
  <use xlink:href="#petal" x="360" y="0" class="p" style="animation-delay:-6.5s"/>
</svg>
