<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 130" width="100%" height="130" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="petal" d="M0 0 C6 -7 15 -4 13 4 C11 12 3 13 0 7 C-3 3 -3 -2 0 0 Z"/>
    <path id="pine" d="M0 -62 L16 -34 L8 -34 L22 -10 L-22 -10 L-8 -34 L-16 -34 Z"/>
  </defs>
  <style>
    .jp { font: 400 15px 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', 'Meiryo', sans-serif; fill: #2b9fc9; letter-spacing: 6px; }
    .p { fill: #f6b6cb; opacity: 0; transform-box: fill-box; transform-origin: center; animation: fall 11s linear infinite; }
    @keyframes fall {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      10%  { opacity: .9; }
      90%  { opacity: .7; }
      100% { transform: translate(30px, 150px) rotate(360deg); opacity: 0; }
    }
  </style>
  <path d="M0 130 L0 85 L120 40 L230 90 L340 55 L450 95 L560 45 L680 92 L800 60 L800 130 Z" fill="#3f8f6e" opacity=".2"/>
  <path d="M0 130 L0 100 Q200 80 400 102 Q600 82 800 100 L800 130 Z" fill="#2f6f5a" opacity=".45"/>
  <g fill="#1f5a49" opacity=".85">
    <use xlink:href="#pine" transform="translate(90 118) scale(.8)"/>
    <use xlink:href="#pine" transform="translate(130 118) scale(.6)"/>
    <use xlink:href="#pine" transform="translate(670 118) scale(.7)"/>
    <use xlink:href="#pine" transform="translate(712 118) scale(.9)"/>
  </g>
  <g fill="#2b7a9b">
    <rect x="236" y="70" width="5" height="48"/>
    <rect x="262" y="70" width="5" height="48"/>
    <rect x="230" y="80" width="43" height="4"/>
    <path d="M222 71 Q251 64 280 71 L277 77 Q251 71 225 77 Z"/>
  </g>
  <text x="400" y="78" text-anchor="middle" class="jp">桜 · 侍 · 城</text>
  <use xlink:href="#petal" x="80"  class="p" style="animation-delay:0s"/>
  <use xlink:href="#petal" x="220" class="p" style="animation-delay:-3s"/>
  <use xlink:href="#petal" x="380" class="p" style="animation-delay:-6s"/>
  <use xlink:href="#petal" x="520" class="p" style="animation-delay:-8s"/>
  <use xlink:href="#petal" x="660" class="p" style="animation-delay:-4s"/>
  <use xlink:href="#petal" x="750" class="p" style="animation-delay:-9.5s"/>
</svg>
