<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 40" width="100%" height="40" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="petal" d="M0 0 C5 -6 12 -3 10 3 C8 9 2 10 0 5 C-2 2 -2 -1 0 0 Z"/>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8f6e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3f8f6e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3f8f6e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p { fill: #f6b6cb; opacity: 0; transform-box: fill-box; transform-origin: center; animation: drift 10s linear infinite; }
    @keyframes drift {
      0%   { transform: translate(-40px, 6px) rotate(0deg);   opacity: 0; }
      10%  { opacity: .9; }
      50%  { transform: translate(400px, 26px) rotate(200deg); }
      90%  { opacity: .8; }
      100% { transform: translate(840px, 10px) rotate(400deg); opacity: 0; }
    }
  </style>
  <rect x="0" y="19" width="800" height="1.5" fill="url(#line)"/>
  <!-- center ornament: torii -->
  <g fill="#2b7a9b">
    <rect x="391" y="11" width="3" height="18"/>
    <rect x="406" y="11" width="3" height="18"/>
    <rect x="388" y="16" width="24" height="2"/>
    <path d="M384 11 Q400 7 416 11 L415 14 Q400 11 385 14 Z"/>
  </g>
  <use xlink:href="#petal" class="p" style="animation-delay:0s"/>
  <use xlink:href="#petal" class="p" style="animation-delay:-2s"/>
  <use xlink:href="#petal" class="p" style="animation-delay:-4s"/>
  <use xlink:href="#petal" class="p" style="animation-delay:-6s"/>
  <use xlink:href="#petal" class="p" style="animation-delay:-8s"/>
</svg>
