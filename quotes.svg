<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130" role="img" aria-label="Rotating Japanese proverbs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a7c0"/>
      <stop offset="1" stop-color="#e0648f"/>
    </linearGradient>
  </defs>
  <style>
    .jp   { font: 600 30px 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', 'Meiryo', sans-serif; fill: url(#pink); letter-spacing: 4px; }
    .ro   { font: italic 400 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e0648f; opacity: .85; letter-spacing: 1px; }
    .en   { font: 400 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8a8a99; }
    .q    { opacity: 0; animation: cycle 18s ease-in-out infinite; }
    .q2   { animation-delay: 6s; }
    .q3   { animation-delay: 12s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
  </style>

  <g class="q">
    <text x="400" y="52" text-anchor="middle" class="jp">七転び八起き</text>
    <text x="400" y="82" text-anchor="middle" class="ro">Nana korobi ya oki</text>
    <text x="400" y="108" text-anchor="middle" class="en">Fall seven times, stand up eight.</text>
  </g>

  <g class="q q2">
    <text x="400" y="52" text-anchor="middle" class="jp">一期一会</text>
    <text x="400" y="82" text-anchor="middle" class="ro">Ichi-go ichi-e</text>
    <text x="400" y="108" text-anchor="middle" class="en">One time, one meeting. Treasure every moment.</text>
  </g>

  <g class="q q3">
    <text x="400" y="52" text-anchor="middle" class="jp">継続は力なり</text>
    <text x="400" y="82" text-anchor="middle" class="ro">Keizoku wa chikara nari</text>
    <text x="400" y="108" text-anchor="middle" class="en">Persistence is power.</text>
  </g>
</svg>
